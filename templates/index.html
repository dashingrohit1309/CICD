```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
            padding-top: 50px;
        }

        .container {
            background: white;
            width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 25px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .info {
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Flask Web App</h1>

        <div class="info">
            <p>Today is <strong>{{ day_of_week }}</strong></p>
            <p>Current time: <strong>{{ current_time }}</strong></p>
        </div>

        <h2>Submit Your Details</h2>

        <form action="/submit" method="POST">

            <input
                type="text"
                name="name"
                placeholder="Enter your name"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <button type="submit">Submit</button>

        </form>

    </div>

</body>
</html>
