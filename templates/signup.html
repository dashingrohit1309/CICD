<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI Chatbot</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #222;
        }

        .container {
            max-width: 650px;
            margin: 30px auto;
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #4f46e5;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        #messages {
            height: 350px;
            overflow-y: auto;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fafafa;
            margin-bottom: 15px;
        }

        .message {
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 8px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .user {
            background: #e0e7ff;
            margin-left: 40px;
        }

        .bot {
            background: #e8f5e9;
            margin-right: 40px;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        #userInput {
            flex: 1;
            min-width: 0;
            padding: 12px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }

        #userInput:focus {
            border-color: #4f46e5;
        }

        button {
            padding: 12px 20px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .footer {
            text-align: center;
            font-size: 12px;
            color: #777;
            margin-top: 18px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 15px;
                margin: 10px auto;
            }

            #messages {
                height: 55vh;
            }

            .input-area {
                gap: 6px;
            }

            button {
                padding: 12px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>✨ Gemini AI Chatbot</h1>
        <p class="subtitle">Ask a question and get an AI-generated answer.</p>

        <div id="messages" aria-live="polite">
            <div class="message bot">
                <strong>Gemini:</strong>
                Hello! How can I help you today?
            </div>
        </div>

        <form id="chatForm" class="input-area">
            <input
                type="text"
                id="userInput"
                placeholder="Type your message..."
                autocomplete="off"
                required
            >
            <button type="submit" id="sendButton">Send</button>
        </form>

        <p class="footer">
            Powered by Flask, Google Gemini API and Kubernetes
        </p>
    </div>

    <script>
        const form = document.getElementById("chatForm");
        const input = document.getElementById("userInput");
        const messages = document.getElementById("messages");
        const sendButton = document.getElementById("sendButton");

        function addMessage(sender, text, type) {
            const message = document.createElement("div");
            message.className = "message " + type;

            const heading = document.createElement("strong");
            heading.textContent = sender + ": ";

            const content = document.createElement("span");
            content.textContent = text;

            message.append(heading, content);
            messages.appendChild(message);
            messages.scrollTop = messages.scrollHeight;

            return message;
        }

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const question = input.value.trim();

            if (!question) {
                return;
            }

            addMessage("You", question, "user");
            input.value = "";
            sendButton.disabled = true;
            input.disabled = true;

            const loading = addMessage(
                "Gemini",
                "Thinking...",
                "bot"
            );

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: question
                    })
                });

                const data = await response.json();

                loading.querySelector("span").textContent =
                    data.response ?? "No response received.";

                if (!response.ok) {
                    loading.classList.add("error");
                }

            } catch (error) {
                loading.querySelector("span").textContent =
                    "Could not connect to the chatbot. Please try again.";

                loading.classList.add("error");

            } finally {
                sendButton.disabled = false;
                input.disabled = false;
                input.focus();
                messages.scrollTop = messages.scrollHeight;
            }
        });
    </script>
</body>
</html>
